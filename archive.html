<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive — Joana Koch Ferreira</title>
  <meta name="description" content="An archive of side projects, explorations and older work by Joana Koch Ferreira, Product Designer.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #290072;
      --text: #0e0e0e;
      --text-muted: #574774;
      --nav-text: #3d3552;
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --gutter: clamp(24px, 6.95vw, 120px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      overflow: hidden;
      font-family: var(--sans);
      color: var(--text);
      background-color: #c7c2d0;
      /* The same colour fields as the Work and About pages, held to the screen while the canvas moves */
      background-image:
        radial-gradient(ellipse 54% 34% at 51% -10%, rgba(242,201,217,.95) 0%, rgba(242,201,217,.551) 45%, rgba(242,201,217,0) 100%),
        radial-gradient(ellipse 37% 80% at 108% 13%, rgba(212,187,244,.85) 0%, rgba(212,187,244,.493) 45%, rgba(212,187,244,0) 100%),
        radial-gradient(ellipse 58% 30% at 55% 112%, rgba(162,180,250,1) 0%, rgba(162,180,250,.58) 45%, rgba(162,180,250,0) 100%),
        radial-gradient(ellipse 42% 65% at 104% 91%, rgba(196,184,239,.9) 0%, rgba(196,184,239,.522) 45%, rgba(196,184,239,0) 100%),
        radial-gradient(ellipse 19% 80% at -6% 70%, rgba(185,239,227,1) 0%, rgba(185,239,227,.58) 45%, rgba(185,239,227,0) 100%),
        radial-gradient(ellipse 56% 35% at 4% -6%, rgba(217,238,223,1) 0%, rgba(217,238,223,.58) 45%, rgba(217,238,223,0) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* Menu principal, the same as on the other pages, floating over the canvas */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      height: 108px;
      padding: 0 var(--gutter);
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .nav a { pointer-events: auto; }
    /* Images pass under the menu softly blurred, so the links stay readable */
    .nav::before {
      content: "";
      position: absolute;
      inset: 0 0 -24px;
      z-index: -1;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      -webkit-mask-image: linear-gradient(#000 55%, transparent);
      mask-image: linear-gradient(#000 55%, transparent);
    }
    .nav__name {
      font-size: 16px;
      line-height: 1.4;
      color: var(--nav-text);
      text-decoration: none;
    }
    .nav__links { display: flex; gap: 36px; }
    .nav__links a {
      font-family: "Inter", var(--sans);
      font-size: 16px;
      line-height: 1.4;
      color: var(--nav-text);
      text-decoration: none;
      padding: 0 3px;
      margin: 0 -3px;
      background: linear-gradient(rgba(41, 0, 114, .13), rgba(41, 0, 114, .13)) no-repeat 0 100% / 100% 0;
      transition: background-size .2s ease;
    }
    .nav__links a:hover { background-size: 100% 3px; }
    .nav__links a[aria-current="page"] { background-size: 100% 3px; }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
    }

    /* Canvas: the images sit on a plane that repeats in every direction and is dragged around */
    .archive {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .archive.is-dragging { cursor: grabbing; }
    .archive__item {
      position: absolute;
      top: 0; left: 0;
      margin: 0;
      will-change: transform;
    }
    .archive__item img {
      display: block;
      width: var(--w, 220px);
      height: auto;
      border-radius: 4px;
      box-shadow: 0 18px 40px rgba(20, 12, 40, .12), 0 2px 6px rgba(20, 12, 40, .06);
      transition: transform .3s ease, box-shadow .3s ease;
      -webkit-user-drag: none;
    }
    .archive__item img:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(20, 12, 40, .16), 0 2px 6px rgba(20, 12, 40, .06);
    }
    .archive.is-dragging .archive__item img { cursor: grabbing; }

    /* The hint */
    .hint {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(41, 0, 114, .08), 0 4px 12px rgba(20, 12, 40, .06);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      pointer-events: none;
      transition: opacity .6s ease;
    }
    .hint svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .hint.is-hidden { opacity: 0; }

    @media (max-width: 900px) {
      .nav__links { gap: 32px; }
    }
    @media (max-width: 480px) {
      .nav { height: 80px; }
      .nav__links { gap: 20px; }
    }
    @media (max-width: 599px) {
      .archive__item img { width: calc(var(--w, 220px) * .72); }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="nav__name" href="/">Joana Koch Ferreira</a>
    <nav class="nav__links">
      <a href="/">Work</a>
      <a href="/archive.html" aria-current="page">Archive</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <main>
    <h1 class="visually-hidden">Archive</h1>
    <!-- Each item sits in a cell of a 4 × 3 grid (data-c = column, data-r = row) that repeats in every direction.
         --w sets its width. The caption is shown under the image when it is opened. -->
    <div class="archive" data-lightbox-group data-lightbox-bare aria-label="Archive. Drag to explore, or use the arrow keys.">
      <figure class="archive__item" data-c="0" data-r="0" style="--w: 220px;">
        <img src="/images/archive/archive-01.webp" alt="Archive project 01" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="1" data-r="0" style="--w: 256px;">
        <img src="/images/archive/archive-06.webp" alt="Archive project 06" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="2" data-r="0" style="--w: 240px;">
        <img src="/images/archive/archive-02.webp" alt="Archive project 02" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="3" data-r="0" style="--w: 256px;">
        <img src="/images/archive/archive-08.webp" alt="Archive project 08" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="0" data-r="1" style="--w: 256px;">
        <img src="/images/archive/archive-10.webp" alt="Archive project 10" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="1" data-r="1" style="--w: 240px;">
        <img src="/images/archive/archive-03.webp" alt="Archive project 03" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="2" data-r="1" style="--w: 256px;">
        <img src="/images/archive/archive-11.webp" alt="Archive project 11" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="3" data-r="1" style="--w: 240px;">
        <img src="/images/archive/archive-05.webp" alt="Archive project 05" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="0" data-r="2" style="--w: 256px;">
        <img src="/images/archive/archive-07.webp" alt="Archive project 07" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="1" data-r="2" style="--w: 240px;">
        <img src="/images/archive/archive-04.webp" alt="Archive project 04" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
      <figure class="archive__item" data-c="2" data-r="2" style="--w: 256px;">
        <img src="/images/archive/archive-09.webp" alt="Archive project 09" draggable="false">
        <figcaption class="visually-hidden">Project name | Type of work</figcaption>
      </figure>
    </div>
  </main>

  <p class="hint" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
    Drag to explore
  </p>

  <script>
  // Infinite canvas: the images sit on a small grid (a tile) that repeats in every direction.
  // Copies of the tile fill the screen; dragging (mouse or touch), a trackpad or the arrow keys move it,
  // and it glides a little after a fling. Copies open the original image, so the lightbox goes through each image once.
  (function () {
    var root = document.querySelector('.archive');
    var hint = document.querySelector('.hint');
    var originals = Array.prototype.slice.call(root.querySelectorAll('.archive__item'));
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var COLS = 4, ROWS = 3;
    // Small offsets so the grid doesn't look rigid (one pair per cell, as a share of the cell)
    var JITTER = [[.10,.05],[-.06,.18],[.04,-.08],[-.10,.10],[.14,-.04],[-.02,.12],[.08,-.10],[-.12,.02],[.02,.14],[.12,-.02],[-.08,.06],[0,0]];
    var cellW, cellH, tileW, tileH, kx, ky, W, H, nodes = [];
    var ox = 0, oy = 0, vx = 0, vy = 0, raf = null;

    function measure() {
      var small = innerWidth < 600;
      cellW = small ? 230 : 320;
      cellH = small ? 170 : 236;
      tileW = COLS * cellW; tileH = ROWS * cellH;
    }

    // Enough copies of the tile to cover the largest this screen can get, plus a margin to wrap in
    function build() {
      measure();
      var maxW = Math.max(screen.width, innerWidth) + 2 * cellW;
      var maxH = Math.max(screen.height, innerHeight) + 2 * cellH;
      kx = Math.max(2, Math.ceil(maxW / tileW));
      ky = Math.max(2, Math.ceil(maxH / tileH));
      W = kx * tileW; H = ky * tileH;
      nodes = [];
      for (var j = 0; j < ky; j++) for (var i = 0; i < kx; i++) {
        originals.forEach(function (it) {
          var el = it;
          if (i || j) {
            el = it.cloneNode(true);
            var img = el.querySelector('img');
            img.setAttribute('data-clone', '');
            img.alt = '';
            img.setAttribute('aria-hidden', 'true');
            el.setAttribute('aria-hidden', 'true');
            img.addEventListener('click', function () { it.querySelector('img').click(); });
            root.appendChild(el);
          }
          var c = +it.dataset.c, r = +it.dataset.r, jt = JITTER[r * COLS + c];
          nodes.push({ el: el, c: c + jt[0], r: r + jt[1], i: i, j: j });
        });
      }
    }

    function mod(n, m) { return ((n % m) + m) % m; }
    function render() {
      nodes.forEach(function (n) {
        var x = mod((n.i * COLS + n.c) * cellW + ox + cellW, W) - cellW;
        var y = mod((n.j * ROWS + n.r) * cellH + oy + cellH, H) - cellH;
        n.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
      });
    }
    function move(dx, dy) { ox += dx; oy += dy; render(); }

    function glide() {
      vx *= .94; vy *= .94;
      if (Math.abs(vx) < .1 && Math.abs(vy) < .1) { raf = null; return; }
      move(vx, vy);
      raf = requestAnimationFrame(glide);
    }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = null; }

    var hidden = false;
    function hideHint() { if (!hidden) { hidden = true; hint.classList.add('is-hidden'); } }

    // Drag
    var down = false, moved = false, lx, ly, lt, sx, sy;
    root.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      stop();
      down = true; moved = false;
      sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now();
      vx = vy = 0;
    });
    root.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - lx, dy = e.clientY - ly, now = performance.now(), dt = Math.max(now - lt, 1);
      if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) {
        moved = true; root.classList.add('is-dragging'); hideHint();
        root.setPointerCapture(e.pointerId); // only once it is a drag, so a plain click still reaches the image
      }
      if (moved) {
        move(dx, dy);
        vx = dx / dt * 16; vy = dy / dt * 16;
      }
      lx = e.clientX; ly = e.clientY; lt = now;
    });
    function end() {
      if (!down) return;
      down = false;
      root.classList.remove('is-dragging');
      if (moved && !reduce && performance.now() - lt < 80) raf = requestAnimationFrame(glide);
    }
    root.addEventListener('pointerup', end);
    root.addEventListener('pointercancel', end);
    // A drag that ends on an image must not open it
    root.addEventListener('click', function (e) {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);

    // Trackpad and mouse wheel
    root.addEventListener('wheel', function (e) {
      e.preventDefault();
      stop();
      move(-e.deltaX, -e.deltaY);
      hideHint();
    }, { passive: false });

    // Arrow keys, when no image is open
    document.addEventListener('keydown', function (e) {
      if (document.querySelector('.lightbox')) return;
      var k = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
      if (!k) return;
      e.preventDefault();
      move(k[0] * 120, k[1] * 120);
      hideHint();
    });

    // Tabbing to an image brings it to the middle of the screen
    root.addEventListener('focusin', function (e) {
      var it = e.target.closest('.archive__item');
      if (!it || !e.target.matches(':focus-visible')) return;
      var r = it.getBoundingClientRect();
      move(innerWidth / 2 - (r.left + r.width / 2), innerHeight / 2 - (r.top + r.height / 2));
    });

    addEventListener('resize', function () {
      var was = cellW;
      measure();
      if (cellW !== was) { // crossing the phone breakpoint: rebuild the copies at the new size
        root.querySelectorAll('[aria-hidden="true"].archive__item').forEach(function (n) { n.remove(); });
        build();
      }
      render();
    });
    build();
    // Start so the grid is roughly centred under the menu
    ox = (innerWidth - tileW) / 2; oy = 96;
    render();
  })();
  </script>
  <script src="/assets/lightbox.js"></script>
</body>
</html>
