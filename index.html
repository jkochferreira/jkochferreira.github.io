<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joana Koch Ferreira — Product Designer</title>
  <meta name="description" content="Portfolio of Joana Koch Ferreira, product designer.">
  <style>
    :root {
      --bg: #fafaf8;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #f2f2f0; --muted: #9a9a9a; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; width: 100%; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
    p { margin-top: 16px; font-size: 1.125rem; line-height: 1.6; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Joana Koch Ferreira</h1>
    <p>Product designer. New portfolio coming soon.</p>
  </main>
</body>
</html>
